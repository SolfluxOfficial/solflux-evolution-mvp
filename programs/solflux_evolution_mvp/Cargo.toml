[package]
name = "solflux_evolution_mvp"
version = "0.1.0"
description = "Solflux MVP"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["idl-build"]
cpi = ["no-entrypoint"]
no-entrypoint = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"
[profile.release]
overflow-checks = true
